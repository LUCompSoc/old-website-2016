<form data-request="onRegister" class="form-horizontal">

    <div class="form-group">
        <label for="display_name" class="col-sm-3 control-label">Full Name</label>
        <div class="col-sm-9">
            <input type="text" class="form-control" id="display_name" name="display_name" value="{{ displayName }}" disabled="disabled">
        </div>
    </div>

    <div class="form-group">
        <label for="username" class="col-sm-3 control-label">Username</label>
        <div class="col-sm-9">
            <input type="text" class="form-control" id="username" name="username" value="{{ username }}" disabled="disabled">
        </div>
    </div>

    <div class="form-group">
        <label for="mail" class="col-sm-3 control-label">Email</label>
        <div class="col-sm-9">
            <input type="email" class="form-control" id="mail" name="mail" value="{{ email }}" disabled="disabled">
        </div>
    </div>

    <div class="form-group">
        <label for="library_card_number" class="col-sm-3 control-label">Library Card No</label>
        <div class="col-sm-9">
            <input type="text" class="form-control" id="library_card_number" name="library_card_number">
        </div>
    </div>

    <div class="form-group">
        <label for="lusu_number" class="col-sm-3 control-label">LUSU Number</label>
        <div class="col-sm-9">
            <input type="text" class="form-control" id="lusu_number" name="lusu_number">
        </div>
    </div>

    <div class="form-group">
        <label for="password" class="col-sm-3 control-label">Position</label>
        <div class="col-sm-9">
            <select name="position" class="form-control">
                <option value="student">Student</option>
                <option value="staff">Staff</option>
            </select>
        </div>
    </div>

</form>
